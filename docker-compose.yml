services:
  appointmentdetailapi:
    image: appointment-detail-api--dev:latest
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8014:8080"
    container_name: appointment-detail-api-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      carenest-network:
        ipv4_address: 192.168.0.11

networks:
  carenest-network:
    external: true
